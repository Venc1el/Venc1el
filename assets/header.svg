<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Sudarmo aka Venc1el, Flutter and full-stack developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#071A3A" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" fill="#F3F0E8"/>
  <rect width="1000" height="300" fill="url(#dots)"/>
  <rect x="3" y="3" width="994" height="294" fill="none" stroke="#071A3A" stroke-width="6"/>

  <!-- name block -->
  <g transform="rotate(-2 330 130)">
    <rect x="58" y="62" width="640" height="150" fill="#071A3A"/>
    <rect x="44" y="48" width="640" height="150" fill="#146BFF" stroke="#071A3A" stroke-width="5"/>
    <text x="68" y="160" textLength="590" lengthAdjust="spacingAndGlyphs"
          font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="104"
          fill="#FFC21A" stroke="#071A3A" stroke-width="3" paint-order="stroke">SUDARMO</text>
  </g>

  <!-- sticker -->
  <g transform="rotate(5 825 112)">
    <rect x="722" y="86" width="230" height="74" fill="#071A3A"/>
    <rect x="710" y="74" width="230" height="74" fill="#FFC21A" stroke="#071A3A" stroke-width="5"/>
    <text x="730" y="122" textLength="190" lengthAdjust="spacingAndGlyphs"
          font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="30"
          fill="#071A3A">aka Venc1el</text>
  </g>

  <!-- marker squiggle -->
  <path d="M56 238 Q76 220 96 238 T136 238 T176 238 T216 238 T256 238 T296 238 T336 238 T376 238"
        fill="none" stroke="#FF3B30" stroke-width="7" stroke-linecap="round"/>

  <!-- spinning asterisk doodle -->
  <g transform="translate(952 236)" stroke="#FF3B30" stroke-width="7" stroke-linecap="round">
    <g>
      <line x1="-24" y1="0" x2="24" y2="0"/>
      <line x1="-24" y1="0" x2="24" y2="0" transform="rotate(60)"/>
      <line x1="-24" y1="0" x2="24" y2="0" transform="rotate(120)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- rotating taglines -->
  <g font-family="'Courier New',Courier,monospace" font-weight="700" font-size="21" fill="#071A3A">
    <text x="410" y="244" opacity="1">Builds apps. Breaks them. Fixes them.
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.02;0.30;0.33;1" values="0;1;1;0;0"/>
    </text>
    <text x="410" y="244" opacity="0">Ctrl+Z is my love language.
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.33;0.35;0.63;0.66;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="410" y="244" opacity="0">Ngoding dulu, mikir belakangan.
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.66;0.69;0.96;1" values="0;0;1;1;0"/>
    </text>
  </g>

  <text x="60" y="278" font-family="'Courier New',Courier,monospace" font-weight="700" font-size="19"
        letter-spacing="2" fill="#146BFF">FLUTTER + FULL-STACK DEVELOPER / SURABAYA, ID</text>
</svg>
